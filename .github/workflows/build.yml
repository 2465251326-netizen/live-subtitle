name: Build and Test (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Offline regression tests (no audio device needed)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import subprocess, sys
          # VAD 边界与队列丢弃单测
          code = r'''
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          from app.audio.capture import Segmenter
          s = Segmenter()
          out = [x for ch in [np.zeros(480, dtype=np.float32)]*40 if (x := s.feed(ch)) is not None]
          assert not out, "pure silence should not trigger"
          sp = np.random.uniform(-0.3, 0.3, 3200).astype(np.float32)
          silo = np.zeros(16000, dtype=np.float32)
          out = [x for ch in list(np.array_split(sp, 6)) + list(np.array_split(silo, 10)) if (x := s.feed(ch)) is not None]
          assert not out, "too short speech should be dropped"
          speech = np.random.uniform(-0.3, 0.3, 16000*20).astype(np.float32)
          out = [x for ch in np.array_split(speech, 333) if (x := s.feed(ch)) is not None]
          assert out and all(o.shape[0]/16000 <= 14.5 for o in out), "long speech should be force-split"
          print("UNIT PASS")
          '''
          r = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          print(r.stdout, r.stderr)
          assert r.returncode == 0, "unit tests failed"
          from app.translate.translator import TranslationCache, _cache
          _cache.put("ci:zh-CN:hello world", ("你好世界", "en"))
          c2 = TranslationCache()
          assert c2.get("ci:zh-CN:hello world") == ("你好世界", "en"), "cache persist failed"
          print("CACHE PASS")

      - name: End-to-end smoke test (real Whisper + real translation engines)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_test.py

      - name: Build EXE with PyInstaller
        run: pyinstaller livesubtitle.spec --noconfirm

      - name: Verify EXE starts and stays alive
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\LiveSubtitle\LiveSubtitle.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            Write-Host "EXE exited early with code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "EXE is running OK (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-Setup-1.0.0
          path: dist/installer/*.exe
          retention-days: 30

      - name: Upload green build
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-portable
          path: dist/LiveSubtitle/
          retention-days: 30
