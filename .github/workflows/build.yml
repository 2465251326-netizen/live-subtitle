name: Build and Test (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Offline regression tests (no audio device needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_units.py

      - name: End-to-end smoke test (real Whisper + real translation engines)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python scripts/smoke_test.py

      - name: ASR speed benchmark (small int8, real CPU RTF)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/bench_asr.py small en 2
          python tests/bench_asr.py small en 1

      - name: Build EXE with PyInstaller
        run: pyinstaller livesubtitle.spec --noconfirm

      - name: Verify EXE starts and stays alive
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\LiveSubtitle\LiveSubtitle.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            Write-Host "EXE exited early with code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "EXE is running OK (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-Setup-1.4.0
          path: dist/installer/*.exe
          retention-days: 30

      - name: Upload green build
        uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle-portable
          path: dist/LiveSubtitle/
          retention-days: 30
